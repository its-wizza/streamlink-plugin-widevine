[dependency-groups]
lint = [
  "ruff ==0.16.0",
]


[tool.pytest.ini_options]
pythonpath = [
    "src",
]
testpaths = [
    "tests",
]


# https://docs.astral.sh/ruff/configuration/
[tool.ruff]
src = ["src"]
extend-exclude = [
  "widevine.py",
  "src/pywidevine_bundled.py",
  "upstream",
]
fix = false
line-length = 128
output-format = "full"
preview = true


[tool.ruff.format]
preview = true
line-ending = "lf"
quote-style = "double"
skip-magic-trailing-comma = false


[tool.ruff.lint]
select = [
  # pycodestyle
  "E",
  "W",
  # pyflakes
  "F",
  # pylint
  "PLC",
  "PLE",
  "PLW",
  # isort
  "I",
  # flake8-async
  "ASYNC",
  # flake8-builtins
  "A",
  # flake8-bugbear
  "B",
  # flake8-commas
  "COM",
  # flake8-comprehensions
  "C4",
  # flake8-datetimez
  "DTZ",
  # flake8-implicit-str-concat
  "ISC",
  # flake8-no-pep420
  "INP",
  # flake8-logging
  "LOG",
  # flake8-pie
  "PIE",
  # flake8-print
  "T20",
  # flake8-type-checking
  "TC",
  # flake8-pytest-style
  "PT",
  # flake8-use-pathlib
  "PTH",
  # flake8-quotes
  "Q",
  # flake8-tidy-imports
  "TID",
  # pyupgrade
  "UP",
  # Ruff-specific rules
  "RUF",
]
ignore = [
  "async-function-with-timeout",
  "builtin-attribute-shadowing",
  "compare-to-empty-string",
  "explicit-string-concatenation",
  "missing-f-string-syntax",
  "multi-line-implicit-string-concatenation",
  "mutable-class-default",
  "parenthesize-chained-operators",
  "redefined-loop-name",
  "return-in-generator",
  "stdlib-module-shadowing",
  "too-many-statements-in-try-clause",
  "unnecessary-collection-call",
  "unnecessary-dunder-call",
  "unsorted-dunder-all",
]
future-annotations = true


[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["unused-import"]
"tools/**" = ["INP", "print"]
"tests/**" = [
  "assert-raises-exception",
  "import-private-name",
  "pytest-assert-in-except",
  "pytest-raises-too-broad",
]
"tests/**/__init__.py" = ["non-empty-init-module"]


[tool.ruff.lint.isort]
lines-after-imports = 2
combine-as-imports = true


[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"


[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = true
mark-parentheses = true


[tool.ruff.lint.flake8-quotes]
avoid-escape = false


[tool.ruff.lint.flake8-implicit-str-concat]
allow-multiline = false
